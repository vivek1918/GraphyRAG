[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-kg"
version = "0.1.0"
description = "Modular Semantic Knowledge Graph System"
authors = [
    {name = "KG System", email = "kg@example.com"},
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "torch>=1.9.0",
    "transformers>=4.21.0",
    "sentence-transformers>=2.2.0",
    "spacy>=3.4.0",
    "rdflib>=6.2.0",
    "fastapi>=0.68.0",
    "pydantic>=1.8.0",
    "pyyaml>=5.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=6.2.0", "black>=21.0", "flake8>=3.9"]
local = [
    "llama-cpp-python>=0.1.0",
    "ollama>=0.1.0",
]

[tool.black]
line-length = 88
target-version = ['py38']