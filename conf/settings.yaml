# System Configuration
system:
  mode: "groq" # local, groq, hf
  data_dir: "./data"
  log_level: "INFO"

# Model Configuration
models:
  embeddings:
    local: "sentence-transformers/all-MiniLM-L6-v2"
    hf: "sentence-transformers/all-MiniLM-L6-v2"

  ner:
    local: "dslim/bert-base-NER"
    hf: "dslim/bert-base-NER"

  relation:
    local: "microsoft/DialoGPT-medium"
    hf: "microsoft/DialoGPT-medium"

  llm:
    groq: "llama-3.1-8b-instant" # Fast Llama model for quick extraction
    local: "llama-7b-q4.gguf"

# Processing Configuration
processing:
  batch_size: 32
  max_text_length: 4096
  chunk_size: 512
  chunk_overlap: 50

# Extraction Configuration
extraction:
  min_confidence: 0.7
  max_entities_per_doc: 100
  coref_resolution: true
  entity_linking: true

# Knowledge Graph Configuration
kg:
  fuseki_url: "http://localhost:3030"
  dataset: "kg"
  neo4j_url: "bolt://localhost:7687"
  neo4j_user: "neo4j"
  neo4j_password: "password" # Change this to your actual Neo4j password

# API Configuration
apis:
  groq:
    base_url: "https://api.groq.com/openai/v1"
    api_key: "your_groq_api_key_here" # ADD THIS LINE with your actual key
    timeout: 30

  hf:
    base_url: "https://api-inference.huggingface.co"
    timeout: 30

rag:
  pdf_directory: "data/raw/pdf"
  vector_store_path: "data/vector_store/faiss_index"
  chunk_size: 1000
  chunk_overlap: 200
  similarity_top_k: 4

groq:
  model: "llama-3.3-70b-versatile"
  temperature: 0.1
  max_tokens: 1024

embeddings:
  model: "sentence-transformers/all-MiniLM-L6-v2"
